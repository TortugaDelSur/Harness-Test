<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Lab</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1d1d1b; --mute:#6b6a64; --line:#e3e1d9; --accent:#c4552d; --ok:#2f7d4f; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  header span { color:var(--mute); font-weight:400; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--ink); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .ev { align-self:flex-start; max-width:85%; font:13px/1.4 ui-monospace, monospace; padding:6px 10px; border-left:3px solid var(--line); color:var(--mute); white-space:pre-wrap; word-break:break-word; }
  .ev.call { border-color:#5b7fc4; } .ev.tool { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:11px 14px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  button { font:inherit; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:none; color:var(--mute); border:1px solid var(--line); padding:6px 12px; }
  aside { width:340px; border-left:1px solid var(--line); background:var(--card); padding:18px; overflow-y:auto; }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:20px 0 8px; }
  h2:first-child { margin-top:0; }
  label.sw { display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  label.sw small { display:block; color:var(--mute); font-size:12px; line-height:1.3; }
  input[type=checkbox] { appearance:none; flex:none; width:38px; height:22px; border-radius:11px; background:#cfcdc4; position:relative; cursor:pointer; transition:.15s; }
  input[type=checkbox]::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; }
  input[type=checkbox]:checked { background:var(--ok); }
  input[type=checkbox]:checked::after { left:19px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .stat { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  .stat b { font-variant-numeric:tabular-nums; }
  @media (max-width:760px) { body { flex-direction:column-reverse; height:auto; } aside { width:auto; border-left:0; } #log { min-height:50vh; } }
</style>
</head>
<body>
<main>
  <header>Harness Lab <span>· el modelo decide, el harness actúa</span></header>
  <div id="log"></div>
  <form id="f">
    <input type="text" id="q" placeholder="Prueba: ¿cuánto es 1234*5678? · ¿qué archivos hay? · me llamo Diego" autocomplete="off" autofocus>
    <button>Enviar</button>
  </form>
</main>

<aside>
  <h2>Herramientas (las "manos")</h2>
  <label class="sw"><input type="checkbox" data-tool="get_time" checked><div>get_time<small>Fecha y hora actual</small></div></label>
  <label class="sw"><input type="checkbox" data-tool="calculator" checked><div>calculator<small>Aritmética exacta</small></div></label>
  <label class="sw"><input type="checkbox" data-tool="list_files" checked><div>list_files<small>Lista la carpeta del proyecto</small></div></label>
  <label class="sw"><input type="checkbox" data-tool="read_file" checked><div>read_file<small>Lee un archivo de la carpeta</small></div></label>

  <h2>Contexto</h2>
  <label class="sw"><input type="checkbox" id="memory" checked><div>Memoria<small>Off: el modelo olvida todo en cada mensaje</small></div></label>
  <label class="sw"><input type="checkbox" id="system" checked><div>System prompt<small>Instrucciones fijas: conciso, en español</small></div></label>
  <label class="sw"><input type="checkbox" id="truncate"><div>Recortar salidas<small>Herramientas devuelven máx. 200 caracteres</small></div></label>

  <h2>Límites</h2>
  <label>Tope de turnos: <b id="tv">5</b>
    <input type="range" id="turns" min="1" max="8" value="5"></label>

  <h2>Estado</h2>
  <div class="stat"><span>Mensajes en contexto</span><b id="s-msgs">0</b></div>
  <div class="stat"><span>Llamadas al modelo</span><b id="s-calls">0</b></div>
  <div class="stat"><span>Tokens de entrada (última)</span><b id="s-tok">0</b></div>
  <p><button class="ghost" id="reset">Borrar memoria</button></p>
</aside>

<script>
const $ = s => document.querySelector(s), log = $("#log");
let calls = 0;

const add = (cls, text) => { const d = document.createElement("div"); d.className = cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; };
const cfg = () => ({
  tools: [...document.querySelectorAll("[data-tool]:checked")].map(e => e.dataset.tool),
  memory: $("#memory").checked, system: $("#system").checked,
  truncate: $("#truncate").checked, max_turns: +$("#turns").value,
});
const post = (url, body) => fetch(url, { method: "POST", body: JSON.stringify(body) }).then(r => r.json());

$("#turns").oninput = e => $("#tv").textContent = e.target.value;

$("#f").onsubmit = async e => {
  e.preventDefault();
  const message = $("#q").value.trim(); if (!message) return;
  $("#q").value = ""; add("msg user", message);
  const wait = add("ev", "pensando…");
  const r = await post("/chat", { message, config: cfg() });
  wait.remove();
  if (r.error) return add("ev", "Error: " + r.error);
  for (const t of r.trace) {
    if (t.type === "call") { calls++; add("ev call", `llamada al modelo · ${t.messages} mensajes · herramientas: ${t.tools.join(", ") || "ninguna"} · ${t.input_tokens} tokens de entrada`); $("#s-tok").textContent = t.input_tokens; }
    else add("ev tool", `el harness ejecuta ${t.name}(${JSON.stringify(t.input)})\n→ ${t.output}`);
  }
  add("msg bot", r.reply);
  $("#s-msgs").textContent = r.context_messages; $("#s-calls").textContent = calls;
};

$("#reset").onclick = async () => { await post("/reset", {}); log.innerHTML = ""; calls = 0; for (const id of ["msgs", "calls", "tok"]) $("#s-" + id).textContent = 0; };
</script>
</body>
</html>
